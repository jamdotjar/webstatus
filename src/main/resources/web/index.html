<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebStatus</title>
</head>
<body>
<h1> WebStatus </h1>
<pre id="json">Loading</pre>
<script>
    async function update() {
        const status = await fetch("/api/status");
        document.getElementById("json").textContent = JSON.stringify(await status.json(), null, 2);
        setTimeout(update, 5000);
    }
    update();
</script>
</body>
</html>
